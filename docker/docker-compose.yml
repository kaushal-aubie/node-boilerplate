  hono-db:
    container_name: hono-db
    # env_file: ../env/production.env
    image: "postgres"
    ports:
      - 4321:5432
      # - ${DB_PORT}:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data

  hono-redis:
    container_name: hono-redis
    image: redis-7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
